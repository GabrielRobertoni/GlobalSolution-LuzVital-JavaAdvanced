spring:
  datasource:
    url: jdbc:h2:mem:luzvital;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false

luzvital:
  jwt:
    segredo: segredo-de-teste-com-mais-de-32-caracteres-123
  ia:
    habilitada: false
  seed:
    habilitado: false
  reprocessamento:
    atraso-inicial: 1h
