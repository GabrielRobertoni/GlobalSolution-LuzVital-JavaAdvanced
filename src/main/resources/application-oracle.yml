# Perfil "oracle": usa o mesmo Oracle da disciplina de banco (tabelas do script da equipe).
# Ative com SPRING_PROFILES_ACTIVE=oracle e informe ORACLE_URL, DB_USER e DB_PASSWORD.
# As colunas e tabelas novas da API (USUARIO, ATENDIMENTO, NOTIFICACAO_PONTO, PLANO_CONTINGENCIA,
# TOKEN_REVOGADO, PACIENTE.ID_USUARIO, coordenadas e OCORRENCIA.DATA_BATERIA etc.) estão em
# scripts/oracle-complemento-api-java.sql.
spring:
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
