# Perfil "oracle": usa o banco Oracle da disciplina de banco (tabelas T_GS_* do GSBancoOracle.sql).
# Usa só as 7 tabelas do GSBancoOracle.sql, sem tabela extra; a API não cria nem altera tabelas e não grava nada ao subir.
# Ative com SPRING_PROFILES_ACTIVE=oracle e informe ORACLE_URL, DB_USER e DB_PASSWORD.
spring:
  datasource:
    url: ${DB_URL:${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      # O esquema é do script da equipe de banco: a API não cria nem altera tabelas no Oracle
      ddl-auto: none
